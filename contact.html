<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Me | 164914 - Imran Ghazi Mohammad Shneiqat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Contact Me</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="contact.html">Contact Me</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Send Me a Message</h2>

      <form id="contactForm" onsubmit="return validateForm()">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname">

        <label for="email">Email Address</label>
        <input type="text" id="email" name="email">

        <label for="country">Country</label>
        <input type="text" id="country" name="country">

        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="5"></textarea>

        <button type="submit">Submit</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Imran Ghazi Mohammad Shneiqat | Jordan University of Science and Technology</p>
  </footer>

  <script>
    function validateForm() {
      var name = document.getElementById("fullname").value.trim();
      var email = document.getElementById("email").value.trim();
      var country = document.getElementById("country").value.trim();
      var comments = document.getElementById("comments").value.trim();

      if (name === "" || email === "" || country === "" || comments === "") {
        alert("Please fill in all fields before submitting.");
        return false;
      }

      if (email.indexOf("@") === -1 || email.indexOf(".") === -1) {
        alert("Please enter a valid email address.");
        return false;
      }

      alert("Thank you! Your form was submitted successfully.");
      document.getElementById("contactForm").reset();
      return false;
    }
  </script>

</body>
</html>
